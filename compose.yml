x-postgres-image: &postgres-image
  build: postgres
  image: ghcr.io/minocorp/openmemory-postgres:main

x-backup-environment: &backup-environment
  OPENMEMORY_BACKUP_PASSPHRASE: ${OPENMEMORY_BACKUP_PASSPHRASE:?set OPENMEMORY_BACKUP_PASSPHRASE in .env}
  OPENMEMORY_BACKUP_RETENTION_DAYS:
  OPENMEMORY_BACKUP_S3_ENDPOINT:
  OPENMEMORY_BACKUP_S3_BUCKET:
  OPENMEMORY_BACKUP_S3_REGION:
  OPENMEMORY_BACKUP_S3_ACCESS_KEY:
  OPENMEMORY_BACKUP_S3_SECRET_KEY:
  OPENMEMORY_BACKUP_S3_URI_STYLE:
  OPENMEMORY_S3_BUCKET:

services:
  server:
    image: ghcr.io/minocorp/openmemory:main
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://openmemory:${OPENMEMORY_DB_PASSWORD:?set OPENMEMORY_DB_PASSWORD in .env}@postgres:5432/openmemory
      OPENMEMORY_PUBLIC_URL: ${OPENMEMORY_PUBLIC_URL:?set OPENMEMORY_PUBLIC_URL in .env}
      OPENMEMORY_BACKUP_STATUS_FILE: /backup/status.json
      OPENMEMORY_TIMEZONE:
      OPENMEMORY_TRUSTED_PROXIES:
      OPENMEMORY_MAX_UPLOAD_BYTES:
      OPENMEMORY_S3_ENDPOINT:
      OPENMEMORY_S3_BUCKET:
      OPENMEMORY_S3_REGION:
      OPENMEMORY_S3_ACCESS_KEY:
      OPENMEMORY_S3_SECRET_KEY:
    ports:
      - "${OPENMEMORY_HTTP_BIND:-127.0.0.1:8080}:8080"
    volumes:
      - blobs:/blobs
      - backup:/backup:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /healthz HTTP/1.0\r\n\r\n" >&3 && head -n 1 <&3 | grep -q " 200 "'
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  postgres:
    <<: *postgres-image
    restart: unless-stopped
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=openmemory archive-push %p
      - -c
      - archive_timeout=60
    environment:
      <<: *backup-environment
      POSTGRES_USER: openmemory
      POSTGRES_PASSWORD: ${OPENMEMORY_DB_PASSWORD:?set OPENMEMORY_DB_PASSWORD in .env}
      POSTGRES_DB: openmemory
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-socket:/var/run/postgresql
      - backup:/backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openmemory -d openmemory"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    shm_size: 256mb

  pgbackrest:
    <<: *postgres-image
    restart: unless-stopped
    user: postgres
    command: ["openmemory-backup"]
    environment:
      <<: *backup-environment
    volumes:
      - postgres-data:/var/lib/postgresql/data:ro
      - postgres-socket:/var/run/postgresql
      - backup:/backup
      - blobs:/blobs:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$$(find /backup/status.json -mmin -10)\""]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s

  restore:
    <<: *postgres-image
    profiles: [restore]
    user: root
    command: ["openmemory-restore"]
    environment:
      <<: *backup-environment
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - backup:/backup
      - blobs:/blobs

volumes:
  postgres-data:
  postgres-socket:
  backup:
  blobs:
