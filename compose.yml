x-postgres-image: &postgres-image
  build: postgres
  image: ghcr.io/minodevss/memory-postgres:main

x-backup-environment: &backup-environment
  MEMORY_BACKUP_PASSPHRASE: ${MEMORY_BACKUP_PASSPHRASE:?set MEMORY_BACKUP_PASSPHRASE in .env}
  MEMORY_BACKUP_RETENTION_DAYS:
  MEMORY_BACKUP_S3_ENDPOINT:
  MEMORY_BACKUP_S3_BUCKET:
  MEMORY_BACKUP_S3_REGION:
  MEMORY_BACKUP_S3_ACCESS_KEY:
  MEMORY_BACKUP_S3_SECRET_KEY:
  MEMORY_BACKUP_S3_URI_STYLE:
  MEMORY_S3_BUCKET:

services:
  server:
    image: ghcr.io/minodevss/memory:main
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://memory:${MEMORY_DB_PASSWORD:?set MEMORY_DB_PASSWORD in .env}@postgres:5432/memory
      MEMORY_PUBLIC_URL: ${MEMORY_PUBLIC_URL:?set MEMORY_PUBLIC_URL in .env}
      MEMORY_BACKUP_STATUS_FILE: /backup/status.json
      MEMORY_TIMEZONE:
      MEMORY_TRUSTED_PROXIES:
      MEMORY_CLIENT_IP_HEADER:
      MEMORY_MAX_UPLOAD_BYTES:
      MEMORY_S3_ENDPOINT:
      MEMORY_S3_BUCKET:
      MEMORY_S3_REGION:
      MEMORY_S3_ACCESS_KEY:
      MEMORY_S3_SECRET_KEY:
    ports:
      - "${MEMORY_HTTP_BIND:-127.0.0.1:8080}:8080"
    volumes:
      - blobs:/blobs
      - backup:/backup:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /healthz HTTP/1.0\r\n\r\n" >&3 && head -n 1 <&3 | grep -q " 200 "'
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  postgres:
    <<: *postgres-image
    restart: unless-stopped
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=memory archive-push %p
      - -c
      - archive_timeout=60
    environment:
      <<: *backup-environment
      POSTGRES_USER: memory
      POSTGRES_PASSWORD: ${MEMORY_DB_PASSWORD:?set MEMORY_DB_PASSWORD in .env}
      POSTGRES_DB: memory
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-socket:/var/run/postgresql
      - backup:/backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory -d memory"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    shm_size: 256mb

  pgbackrest:
    <<: *postgres-image
    restart: unless-stopped
    user: postgres
    command: ["memory-backup"]
    environment:
      <<: *backup-environment
    volumes:
      - postgres-data:/var/lib/postgresql/data:ro
      - postgres-socket:/var/run/postgresql
      - backup:/backup
      - blobs:/blobs:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$$(find /backup/status.json -mmin -10)\""]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s

  restore:
    <<: *postgres-image
    profiles: [restore]
    user: root
    command: ["memory-restore"]
    environment:
      <<: *backup-environment
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - backup:/backup
      - blobs:/blobs

volumes:
  postgres-data:
  postgres-socket:
  backup:
  blobs:
