[advisories]
unmaintained = "workspace"
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa 0.10 release candidates carry the constant-time fix; the crate arrives only through webauthn-rs, which uses it to verify public-key signatures" },
]

[licenses]
allow = ["Apache-2.0", "BSD-3-Clause", "CDLA-Permissive-2.0", "ISC", "MIT", "MPL-2.0", "Unicode-3.0", "Zlib"]

[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
skip = [
    { crate = "base64@0.21.7", reason = "webauthn-rs" },
    { crate = "base64@0.22.1", reason = "sqlx" },
    { crate = "block-buffer@0.10.4", reason = "webauthn-rs and rmcp use RustCrypto 0.10" },
    { crate = "cpufeatures@0.2.17", reason = "webauthn-rs and rmcp use RustCrypto 0.10" },
    { crate = "crypto-common@0.1.7", reason = "webauthn-rs and rmcp use RustCrypto 0.10" },
    { crate = "digest@0.10.7", reason = "webauthn-rs, rmcp and object_store use RustCrypto 0.10" },
    { crate = "rand_core@0.6.4", reason = "rmcp through oauth2 5 and webauthn-rs" },
    { crate = "getrandom@0.2.17", reason = "ring and rmcp through oauth2 5" },
    { crate = "thiserror@1.0.69", reason = "oauth2 5 and webauthn-rs" },
    { crate = "thiserror-impl@1.0.69", reason = "oauth2 5 and webauthn-rs" },
    { crate = "tower-http@0.6.11", reason = "reqwest" },
    { crate = "hashbrown@0.14.5", reason = "dashmap through governor" },
    { crate = "hashbrown@0.16.1", reason = "governor and sqlx" },
    { crate = "windows-sys@0.52.0", reason = "ring" },
    { crate = "syn@2.0.119", reason = "proc-macro crates not yet on syn 3" },
    { crate = "synstructure@0.13.2", reason = "proc-macro crates not yet on syn 3" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
