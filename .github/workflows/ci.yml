name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgres://memory:memory@127.0.0.1:5441/memory
  SQLX_OFFLINE: "true"

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build and start Postgres
        run: |
          docker build -t memory-postgres:17 postgres
          docker run -d --name postgres -p 5441:5432 \
            -e POSTGRES_USER=memory -e POSTGRES_PASSWORD=memory -e POSTGRES_DB=memory \
            memory-postgres:17
          until docker exec postgres pg_isready -U memory -d memory; do sleep 1; done
      - name: Squawk on new migrations
        run: |
          base=$(git merge-base HEAD origin/main)
          files=$(git diff --name-only --diff-filter=A "$base" HEAD -- 'crates/memory-server/migrations/*.sql')
          if [ -n "$files" ]; then
            npx --yes squawk-cli@2.74.0 --config .squawk.toml $files
          fi
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo install sqlx-cli --version 0.9.1 --locked --no-default-features --features postgres,rustls
      - run: cargo sqlx prepare --workspace --check -- --all-targets
      - run: cargo test --workspace --locked
      - name: OpenAPI document is committed
        run: cargo run --locked -q -p memory-server -- openapi | diff - web/openapi.json
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny check

  stack:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - run: scripts/smoke.sh

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - name: Generated API types are committed
        run: |
          pnpm gen:types
          git diff --exit-code

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: sudo apt-get install -y --no-install-recommends poppler-utils
      - run: docker compose -f compose.dev.yml up -d --build --wait
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - run: pnpm e2e
        working-directory: web
