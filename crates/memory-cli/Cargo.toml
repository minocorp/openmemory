[package]
name = "memory-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "memory"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
bytes.workspace = true
clap.workspace = true
clap_complete.workspace = true
futures-util.workspace = true
keyring-core.workspace = true
memory-api.workspace = true
rand = { workspace = true, features = ["thread_rng"] }
reqwest = { workspace = true, features = ["form", "json", "query", "stream"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-std", "process"] }
tokio-util.workspace = true
url.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { workspace = true, features = ["rt-tokio-crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { workspace = true, features = ["keychain"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store.workspace = true

[dev-dependencies]
axum.workspace = true
memory-server.workspace = true
object_store.workspace = true
sqlx.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["process"] }

[lints]
workspace = true
